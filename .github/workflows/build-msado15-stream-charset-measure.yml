name: Measure ADODB.Stream charsets

on:
  push:
    branches: ['topic/msado15-stream-charset-measure']
    paths:
      - 'docs/wine-repro/msado15-stream-charset/measure.c'
      - 'docs/wine-repro/msado15-stream-charset/*.vbs'
      - 'docs/wine-repro/msado15-stream-charset/measure.list'
      - 'docs/wine-repro/msado15-stream-charset/run-wine.sh'
      - '.github/workflows/build-msado15-stream-charset-measure.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned LLVM MinGW
        run: |
          toolchain=llvm-mingw-20250910-ucrt-ubuntu-22.04-x86_64
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 --max-time 120 -o "$toolchain.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20250910/$toolchain.tar.xz"
          printf '%s  %s\n' f83556c9ffa4d4291fadea1a0776c1383332dacdf4d7fbdf974c2928cb32c6f7 "$toolchain.tar.xz" | sha256sum -c -
          tar -xJf "$toolchain.tar.xz"
          printf '%s\n' "$RUNNER_TEMP/$toolchain/bin" >> "$GITHUB_PATH"
      - name: Build the Windows bundle
        run: |
          bash scripts/build-measure-bundle.sh out docs/wine-repro/msado15-stream-charset/measure.list
          cp docs/wine-repro/msado15-stream-charset/*.vbs out/
          cd out
          sha256sum ./*.exe ./*.vbs ./README.txt ./measure.manifest ./run-measure.bat > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msado15-stream-charset-measure
          path: out/
          if-no-files-found: error
          retention-days: 30

  wine:
    needs: measure
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla-11.22, winum-11.22-2]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Arch build and X11 dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git mingw-w64-gcc curl xz             xorg-server-xvfb xorg-xauth libx11 libxext libxi libxrandr libxrender             libxcursor libxcomposite libxinerama libxxf86vm libxkbcommon             fontconfig freetype2 ttf-dejavu alsa-lib libpulse gnutls krb5 dbus             wayland mesa libglvnd vulkan-icd-loader gst-plugins-base-libs sdl2             libcups libgphoto2 sane libpcap v4l-utils pcsclite unixodbc giflib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: msado15-stream-charset-measure
          path: bundle
      - name: Build vanilla Wine 11.22
        if: matrix.variant == 'vanilla-11.22'
        run: |
          source wine/version.env
          source scripts/lib/wine-source.sh
          test "$WINE_VERSION" = 11.22
          export WINE_PINNED_VERSION="$WINE_VERSION"
          curl -fLsS --retry 3 -o /tmp/wine-source.tar.xz https://dl.winehq.org/wine/source/11.x/wine-11.22.tar.xz
          wine_verify_tarball /tmp/wine-source.tar.xz 11.22
          tar -xJf /tmp/wine-source.tar.xz -C /tmp
          mkdir /tmp/wine-11.22/build
          cd /tmp/wine-11.22/build
          ../configure --enable-archs=x86_64,i386 --disable-tests --with-x --without-wayland             --without-vulkan --without-opengl > /tmp/configure.log 2>&1 ||
              { tail -n 80 /tmp/configure.log; exit 1; }
          make -j"$(nproc)" > /tmp/build.log 2>&1 || { tail -n 80 /tmp/build.log; exit 1; }
      - name: Download and verify the Winum 11.22-2 release
        if: matrix.variant == 'winum-11.22-2'
        run: |
          artifact=winum-11.22-2-x86_64.tar.xz
          cd /tmp
          curl -fLsS --retry 3 -O "https://github.com/Harvi654/winum/releases/download/winum-11.22-2/$artifact"
          printf '%s  %s\n' 0523b2615596cbb66e7e9ed95a5024008a25f5141ba2e4483e862a47db0c9980 "$artifact" | sha256sum -c -
          tar -xJf "$artifact"
      - name: Measure both architectures in Xvfb
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [[ "$VARIANT" == vanilla-11.22 ]]; then
            loader=/tmp/wine-11.22/build/wine
            server=/tmp/wine-11.22/build/server/wineserver
          else
            loader=/tmp/winum-11.22-2-x86_64/bin/wine
            server=/tmp/winum-11.22-2-x86_64/bin/wineserver
          fi
          xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' bash             docs/wine-repro/msado15-stream-charset/run-wine.sh "$loader" "$server" bundle results
      - name: Report measurements
        if: always()
        run: |
          shopt -s nullglob
          for file in results/result-*.txt; do
            printf 'MEASURE_BEGIN %s\n' "${file##*/}"
            gzip -nc "$file" | base64 -w 100
            printf 'MEASURE_END %s\n' "${file##*/}"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: msado15-stream-charset-${{ matrix.variant }}
          path: |
            results/result-*.txt
          if-no-files-found: warn
          retention-days: 30
