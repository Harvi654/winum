name: Build AF_UNIX v4 MEASURE

on:
  push:
    branches: ['topic/ws2_32-af-unix-v4']
    paths:
      - 'docs/wine-repro/ws2_32-afunix/**'
      - 'scripts/build-measure-ws2_32-afunix-v4.sh'
      - '.github/workflows/build-ws2_32-afunix-v4-measure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: MinGW (official Arch repositories)
        run: pacman -Syu --noconfirm --needed git mingw-w64-gcc
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: |
          bash scripts/build-measure-ws2_32-afunix-v4.sh out
          cd out
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: afunix-v4-measure
          path: out/
          retention-days: 30

  wine-v3:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Runtime dependencies (official Arch repositories)
        run: |
          pacman -Syu --noconfirm --needed python xorg-server-xvfb xorg-xauth \
            fontconfig freetype2 ttf-dejavu libx11 libxext libxi libxrandr libxrender libxcursor libxcomposite libxinerama libxxf86vm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: afunix-v4-measure
          path: bundle/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: afunix-candidate
          run-id: 44080539901
          github-token: ${{ github.token }}
          path: runtime/
      - name: Measure v3 and exchange data with a Linux socket
        run: |
          set -o pipefail
          (cd bundle && sha256sum -c SHA256SUMS)
          (cd runtime && sha256sum -c winum-11.22-1-afunix-x86_64.tar.xz.sha256 &&
            tar -xJf winum-11.22-1-afunix-x86_64.tar.xz)
          grep -F '(c11a4f8)' runtime/winum-11.22-1-afunix-x86_64/CANDIDATE.txt
          xvfb-run -a python3 bundle/run-host-peer.py --measure \
            runtime/winum-11.22-1-afunix-x86_64/bin/wine bundle | tee result-wine-v3.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: afunix-v3-comparison
          path: result-wine-v3.txt
          retention-days: 30
