name: Measure user32 SetWindowPos stale bits

on:
  push:
    branches: ['topic/user32-stale-bits-measure']
    paths:
      - 'docs/wine-repro/user32-setwindowpos-stale-bits/measure.c'
      - 'docs/wine-repro/user32-setwindowpos-stale-bits/measure-h.inc'
      - 'docs/wine-repro/user32-setwindowpos-stale-bits/measure.list'
      - 'docs/wine-repro/user32-setwindowpos-stale-bits/run-wine.sh'
      - '.github/workflows/build-user32-stale-bits-measure.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the MinGW compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
      - name: Build the Windows bundle
        run: |
          bash scripts/build-measure-bundle.sh out docs/wine-repro/user32-setwindowpos-stale-bits/measure.list
          (cd out && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: user32-stale-bits-measure
          path: out/
          if-no-files-found: error
          retention-days: 30

  wine:
    needs: measure
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla-11.22, winum-11.22-2]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Arch build and X11 dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git mingw-w64-gcc curl xz             xorg-server-xvfb xorg-xauth libx11 libxext libxi libxrandr libxrender             libxcursor libxcomposite libxinerama libxxf86vm libxkbcommon             fontconfig freetype2 ttf-dejavu alsa-lib libpulse gnutls krb5 dbus             wayland mesa libglvnd vulkan-icd-loader gst-plugins-base-libs sdl2             libcups libgphoto2 sane libpcap v4l-utils pcsclite unixodbc giflib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: user32-stale-bits-measure
          path: bundle
      - name: Build vanilla Wine 11.22
        if: matrix.variant == 'vanilla-11.22'
        run: |
          source wine/version.env
          source scripts/lib/wine-source.sh
          test "$WINE_VERSION" = 11.22
          export WINE_PINNED_VERSION="$WINE_VERSION"
          curl -fLsS --retry 3 -o /tmp/wine-source.tar.xz https://dl.winehq.org/wine/source/11.x/wine-11.22.tar.xz
          wine_verify_tarball /tmp/wine-source.tar.xz 11.22
          tar -xJf /tmp/wine-source.tar.xz -C /tmp
          mkdir /tmp/wine-11.22/build
          cd /tmp/wine-11.22/build
          ../configure --enable-archs=x86_64,i386 --disable-tests --with-x --without-wayland             --without-vulkan --without-opengl > /tmp/configure.log 2>&1 ||
              { tail -n 80 /tmp/configure.log; exit 1; }
          make -j"$(nproc)" > /tmp/build.log 2>&1 || { tail -n 80 /tmp/build.log; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.variant == 'winum-11.22-2'
        with:
          github-token: ${{ github.token }}
          run-id: 45064416572
          name: winum-11.22-2-candidate-binary
          path: /tmp/winum-artifact
      - name: Verify the Winum 11.22-2 test build
        if: matrix.variant == 'winum-11.22-2'
        run: |
          cd /tmp/winum-artifact
          sha256sum -c winum-11.22-2-x86_64.tar.xz.sha256
          printf '%s  %s\n' 1a009f20c06a22277f1cc0b26f7208c8cba5f46dc4d5fe31e93c4b4936206bd2             winum-11.22-2-x86_64.tar.xz | sha256sum -c -
          tar -xJf winum-11.22-2-x86_64.tar.xz -C /tmp
      - name: Measure both architectures in Xvfb
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [[ "$VARIANT" == vanilla-11.22 ]]; then
            loader=/tmp/wine-11.22/build/wine
            server=/tmp/wine-11.22/build/server/wineserver
          else
            loader=/tmp/winum-11.22-2-x86_64/bin/wine
            server=/tmp/winum-11.22-2-x86_64/bin/wineserver
          fi
          xvfb-run -a -s '-screen 0 2048x1152x24 -dpi 96 -nolisten tcp' bash             docs/wine-repro/user32-setwindowpos-stale-bits/run-wine.sh "$loader" "$server" bundle results
      - name: Report measurements
        if: always()
        run: |
          shopt -s nullglob
          for file in results/result-*.txt; do
            printf 'MEASURE_BEGIN %s\n' "${file##*/}"
            sed 's/\r$//' "$file"
            printf 'MEASURE_END %s\n' "${file##*/}"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: user32-stale-bits-${{ matrix.variant }}
          path: results/result-*.txt
          if-no-files-found: warn
          retention-days: 30
