# Build of vkd3d-proton 3.0.1 with gpu/vkd3d-proton/*.patch (Inventor's GPU
# ray tracing). On main and topic branches when gpu/vkd3d-proton changes;
# uploads artifacts, publishes nothing yet (see gpu/vkd3d-proton/README.md). Also shows the synthetic shaders in
# gpu/vkd3d-proton/tests/ failing spirv-val without the patch and passing
# with it.
name: Build vkd3d-proton

on:
  push:
    branches: [main, 'topic/**']
    paths: ['gpu/vkd3d-proton/**', '.github/workflows/build-vkd3d.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  VKD3D_TAG: v3.0.1
  VKD3D_COMMIT: 3b10bd7a7ec6a7347e616cf8bea59333afec2255

jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 120
    steps:
      - name: Dependencies (official Arch repositories)
        run: pacman -Syu --noconfirm --needed git meson ninja cmake glslang mingw-w64-gcc wine python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: winum
      - name: vkd3d-proton source
        run: |
          git clone --branch "$VKD3D_TAG" --recursive --depth 1 --shallow-submodules https://github.com/HansKristian-Work/vkd3d-proton.git src
          test "$(git -C src rev-parse HEAD)" = "$VKD3D_COMMIT"
      - name: Shader check without the patches
        run: |
          cmake -S src/subprojects/dxil-spirv -B check-base -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          ninja -C check-base dxil-spirv
      - name: Apply patches
        run: |
          for p in winum/gpu/vkd3d-proton/*.patch; do echo "== $p"; patch -d src -p1 --fuzz=0 < "$p"; done
      - name: Shader check with the patches
        run: |
          cmake -S src/subprojects/dxil-spirv -B check-patched -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          ninja -C check-patched dxil-spirv
          # Negative control: unpatched 3.0.1 must reject every fixture with the
          # long-vector diagnostic; the patched converter must accept every one.
          fail=0 count=0
          for d in winum/gpu/vkd3d-proton/tests/*.dxil; do
            n="$(basename "$d")"; count=$((count + 1))
            if check-base/dxil-spirv "$d" --debug-all-entry-points --validate > base.log 2>&1; then
              b="valid (UNEXPECTED)"; fail=1
            elif grep -q 'Illegal number of components' base.log; then
              b="invalid, long-vector diagnostic"
            else
              b="invalid for another reason (UNEXPECTED)"; fail=1; tail -5 base.log
            fi
            if check-patched/dxil-spirv "$d" --debug-all-entry-points --validate > patched.log 2>&1; then
              p=valid
            else
              p=INVALID; fail=1; tail -5 patched.log
            fi
            echo "$n: 3.0.1 $b, patched $p"
          done
          [ "$count" -eq 6 ] || { echo "expected 6 fixtures, found $count"; fail=1; }
          exit $fail
      - name: Build Windows DLLs
        run: |
          cd src
          ./package-release.sh 3.0.1-winum-rt ../out --no-package
          find ../out -name '*.dll' | sort
          cd ../out && find . -name '*.dll' -exec sha256sum {} + | sort -k2 > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vkd3d-proton-3.0.1-winum-rt
          path: out/
          retention-days: 30
