name: Build and measure the HKCR class reads candidate

on:
  push:
    branches: ['topic/kernelbase-hkcr-read-measure']
    paths:
      - 'patches/candidates/kernelbase-hkcr-class-reads/*.patch'
      - '.github/workflows/build-kernelbase-hkcr-class-reads-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependencies (official Arch repositories)
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git mingw-w64-gcc curl xz python \
            xorg-server-xvfb xorg-xauth libx11 libxext libxi libxrandr libxrender \
            libxcursor libxcomposite libxinerama libxxf86vm libxkbcommon \
            fontconfig freetype2 ttf-dejavu alsa-lib libpulse gnutls krb5 dbus \
            wayland mesa libglvnd vulkan-icd-loader gst-plugins-base-libs sdl2 \
            libcups libgphoto2 sane libpcap v4l-utils pcsclite unixodbc giflib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned LLVM MinGW
        run: |
          toolchain=llvm-mingw-20250910-ucrt-ubuntu-22.04-x86_64
          cd /tmp
          curl -fLsS --retry 3 --max-time 120 -o "$toolchain.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20250910/$toolchain.tar.xz"
          printf '%s  %s\n' f83556c9ffa4d4291fadea1a0776c1383332dacdf4d7fbdf974c2928cb32c6f7 "$toolchain.tar.xz" | sha256sum -c -
          tar -xJf "$toolchain.tar.xz"
          printf '%s\n' "/tmp/$toolchain/bin" >> "$GITHUB_PATH"
      - name: Build both candidate DLLs with zero fuzz
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source wine/version.env
          source scripts/lib/wine-source.sh
          source scripts/lib/wine-patches.sh
          export WINE_PINNED_VERSION="$WINE_VERSION"
          test "$WINE_VERSION" = 11.22
          src="/tmp/wine-$WINE_VERSION"
          curl -fLsS --retry 3 -o "$src.tar.xz" \
            "https://dl.winehq.org/wine/source/11.x/wine-$WINE_VERSION.tar.xz"
          wine_verify_tarball "$src.tar.xz" "$WINE_VERSION"
          tar -xJf "$src.tar.xz" -C /tmp
          wine_apply_patches "$src" "$GITHUB_WORKSPACE/patches" "$GITHUB_WORKSPACE" HEAD
          patch -d "$src" -p1 --fuzz=0 < patches/candidates/kernelbase-hkcr-class-reads/kernelbase-hkcr-class-reads.patch
          bash scripts/build-l1-kernelbase-hkcr-read.sh unit "$src.tar.xz"
          mkdir "$src/build"
          cd "$src/build"
          ../configure --enable-archs=x86_64,i386 --disable-tests --without-x \
            --without-wayland --without-vulkan --without-opengl --without-freetype \
            --without-fontconfig --without-alsa --without-pulse > configure.log 2>&1 ||
            { tail -n 60 configure.log; exit 1; }
          make -j"$(nproc)" dlls/kernelbase/{x86_64,i386}-windows/kernelbase.dll > build.log 2>&1 ||
            { tail -n 80 build.log; exit 1; }
      - name: Assemble the test runtime from Winum 11.22-2
        run: |
          artifact=winum-11.22-2-x86_64.tar.xz
          cd /tmp
          curl -fLsS --retry 3 -O "https://github.com/Harvi654/winum/releases/download/winum-11.22-2/$artifact"
          printf '%s  %s\n' 0523b2615596cbb66e7e9ed95a5024008a25f5141ba2e4483e862a47db0c9980 "$artifact" | sha256sum -c -
          tar -xJf "$artifact"
          out="$GITHUB_WORKSPACE/overlay"
          mkdir -p "$out"
          for arch in x86_64 i386; do
            mkdir -p "$out/$arch-windows"
            dll="/tmp/wine-11.22/build/dlls/kernelbase/$arch-windows/kernelbase.dll"
            cp "$dll" "winum-11.22-2-x86_64/lib/wine/$arch-windows/kernelbase.dll"
            cp "$dll" "$out/$arch-windows/"
          done
          cp /tmp/wine-11.22/{COPYING.LIB,PATCHES.txt} "$out/"
          cp "$GITHUB_WORKSPACE/patches/candidates/kernelbase-hkcr-class-reads/kernelbase-hkcr-class-reads.patch" "$out/"
          cd "$out"
          printf 'kernelbase HKCR overlay for Winum 11.22-2\nCommit %s\n' "$GITHUB_SHA" > BUILDINFO
          sha256sum BUILDINFO COPYING.LIB PATCHES.txt ./*.patch ./*-windows/kernelbase.dll > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Run the native assertions and record the synthetic matrix
        run: |
          export runtime=/tmp/winum-11.22-2-x86_64
          export WINESERVER="$runtime/bin/wineserver"
          export WINEPREFIX=/tmp/hkcr-candidate-prefix WINEDEBUG=-all WINEDLLOVERRIDES='mscoree,mshtml='
          export WINETEST_PLATFORM=windows
          mkdir -p results
          xvfb-run -a bash -u -c '
            stop_wine() { "$WINESERVER" -k >/dev/null 2>&1 || true; "$WINESERVER" -w; }
            trap stop_wine EXIT
            timeout 120 "$runtime/bin/wine" wineboot -i || exit 1
            "$WINESERVER" -w
            "$runtime/bin/wine" reg add "HKCU\Software\Classes\Wow6432Node\CLSID" /f /reg:64 || exit 1
            failed=0
            for arch in x86_64 i686; do
              timeout 120 "$runtime/bin/wine" "unit/hkcr-read-$arch.exe" --direct-machine \
                --run-test "unit/hkcr-class-reads-$arch.exe" > "results/unit-$arch.txt" 2>&1 || failed=1
              cat "results/unit-$arch.txt"
              grep -Eq "57 tests executed .*0 failures.*0 skipped" "results/unit-$arch.txt" || failed=1
              grep -q "^measure_complete=1 user_cleanup=0 machine_cleanup=0" "results/unit-$arch.txt" || failed=1
              timeout 120 "$runtime/bin/wine" "unit/hkcr-read-$arch.exe" --direct-machine \
                > "results/measure-$arch.txt" 2>&1 || failed=1
              grep -q "^measure_complete=1 user_cleanup=0 machine_cleanup=0" "results/measure-$arch.txt" || failed=1
            done
            exit "$failed"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kernelbase-hkcr-class-reads-candidate-results
          path: results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernelbase-hkcr-class-reads-overlay
          path: overlay/
          if-no-files-found: error
