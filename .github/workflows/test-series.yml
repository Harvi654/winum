# L2 for the whole series and the L1 bundle: builds Wine with its tests
# (vanilla and patches/series), runs the test units of the DLLs the series
# touches in both, compares them (scripts/compare-tests.py) and packs the
# Wine test programs of patches whose tests never ran on Windows.
# One job per variant and test group, so that no job reaches GitHub's 6 h
# limit (a single job per variant did on 2026-11-07). Each job builds Wine
# itself. Runs when started by hand (optionally one group only, to measure
# its time) or by a push to a test-run/<name> branch; publishes nothing.
name: Test series (L1 bundle, L2)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this group (g1..g5); empty = all'
        required: false
        default: ''
  push:
    branches: ['test-run/**']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, series]
        group: [g1, g2, g3, g4, g5]
        include:
          - group: g1
            tests: user32
          - group: g2
            tests: win32u gdi32 comctl32 opengl32 glu32
          - group: g3
            tests: ntdll kernelbase advapi32 combase ole32 oleaut32 rpcrt4 urlmon
          - group: g4
            tests: msi
          - group: g5
            tests: msxml3 mspatcha riched20 shell32 wbemprox wininet
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 350
    env:
      RUN_GROUP: ${{ inputs.only == '' || inputs.only == matrix.group }}
    steps:
      - name: Dependencies (official Arch repositories)
        if: env.RUN_GROUP == 'true'
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git python mingw-w64-gcc xorg-server-xvfb xorg-xauth \
            alsa-lib libpulse gnutls krb5 dbus fontconfig freetype2 ttf-dejavu \
            libx11 libxext libxi libxrandr libxrender libxcursor libxcomposite libxinerama libxxf86vm libxkbcommon \
            wayland mesa libglvnd vulkan-icd-loader vulkan-headers \
            gst-plugins-base-libs sdl2 libcups libgphoto2 sane libpcap v4l-utils pcsclite unixodbc ocl-icd opencl-headers \
            giflib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.RUN_GROUP == 'true'
        with:
          fetch-depth: 0
      - name: Build with tests and run group ${{ matrix.group }}
        if: env.RUN_GROUP == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export JOBS="$(nproc)"
          export WORK=/tmp/work
          export TESTS="${{ matrix.tests }}"
          export GROUP="${{ matrix.group }}"
          export MAKE_L1="${{ matrix.group == 'g1' && '1' || '0' }}"
          bash scripts/test-series.sh ${{ matrix.variant }} out
      - name: Build log on failure
        if: failure() && env.RUN_GROUP == 'true'
        run: tail -n 80 /tmp/work/*.log || true
      - name: Slowest units
        if: always() && env.RUN_GROUP == 'true'
        run: sort -t "$(printf '\t')" -k4 -nr out/durations-*.tsv 2>/dev/null | head -15 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && env.RUN_GROUP == 'true'
        with:
          name: tests-${{ matrix.variant }}-${{ matrix.group }}
          path: out/
          retention-days: 30

  compare:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tests-vanilla-*
          path: results/vanilla
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tests-series-*
          path: results/series
      - name: Compare vanilla and series (all groups that ran on both sides)
        run: |
          set -o pipefail
          rc=0
          python3 scripts/compare-tests.py compare results/vanilla results/series > l2-report.md || rc=$?
          cat l2-report.md >> "$GITHUB_STEP_SUMMARY"
          cat l2-report.md   # also in the log, readable without the web page
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: l2-report
          path: l2-report.md
