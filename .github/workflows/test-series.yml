# L2 for the whole series and the L1 bundle: builds Wine with its tests
# (vanilla and patches/series), runs the test units of the DLLs the series
# touches in both, compares them (scripts/compare-tests.py) and packs the
# Wine test programs of patches whose tests never ran on Windows.
# One job per variant and test group, so that no job reaches GitHub's 6 h
# limit (a single job per variant did on 2026-11-07). Each job builds Wine
# itself. Runs when started by hand (optionally one group only, to measure
# its time) or by a push to a test-run/<name> branch; publishes nothing.
name: Test series (L1 bundle, L2)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this group (g1..g5); empty = all'
        required: false
        default: ''
  push:
    branches: ['test-run/**']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, series]
        group: [g1]
        include:
          - group: g1
            tests: user32
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 350
    env:
      L1_UNITS: user32:attachment
      ONLY_UNIT: attachment
      UNIT_TIMEOUT: '600'
      VARIANT: ${{ matrix.variant }}
      RUN_GROUP: ${{ inputs.only == '' || inputs.only == matrix.group }}
    steps:
      - name: Dependencies (official Arch repositories)
        if: env.RUN_GROUP == 'true'
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git python mingw-w64-gcc xorg-server-xvfb xorg-xauth \
            alsa-lib libpulse gnutls krb5 dbus fontconfig freetype2 ttf-dejavu \
            libx11 libxext libxi libxrandr libxrender libxcursor libxcomposite libxinerama libxxf86vm libxkbcommon \
            wayland mesa libglvnd vulkan-icd-loader vulkan-headers \
            gst-plugins-base-libs sdl2 libcups libgphoto2 sane libpcap v4l-utils pcsclite unixodbc ocl-icd opencl-headers \
            giflib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.RUN_GROUP == 'true'
        with:
          fetch-depth: 0
      - name: Build with tests and run group ${{ matrix.group }}
        if: env.RUN_GROUP == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export JOBS="$(nproc)"
          export WORK=/tmp/work
          export TESTS="${{ matrix.tests }}"
          export GROUP="${{ matrix.group }}"
          export MAKE_L1="${{ matrix.group == 'g1' && '1' || '0' }}"
          bash scripts/test-series.sh ${{ matrix.variant }} out
      - name: Require component coverage and report the absolute-state scope
        if: always() && env.RUN_GROUP == 'true'
        run: |
          python3 - <<'COVERAGE'
          import json, os, re
          from pathlib import Path
          variant = os.environ['VARIANT']
          results = json.loads(Path('out/results-' + variant + '-g1.json').read_text())
          errors = []
          report = {'variant': variant, 'source_commit': os.environ['GITHUB_SHA'], 'units': {}, 'errors': errors}
          for arch in ['i386', 'x86_64']:
              key = 'user32.' + arch + '.attachment'
              result = results[key]
              log = Path('out/logs/' + key + '.log').read_text(errors='replace')
              match = re.search(r'ATTACHMENT_COVERAGE completed=(\d+) skipped=(\d+) attempted=44', log)
              scope = re.search(r'ATTACHMENT_SCOPE component_snapshots=(\d+) absolute_snapshots=(\d+) absolute_state=(-?\d+) positive_checks=(\d+)', log)
              print(key, 'scope=' + (scope.group(0) if scope else 'missing'), 'coverage=' + (match.group(0) if match else 'missing'),
                    'finished=' + str(result['finished']), 'failures=' + str(result['failures']),
                    'todos=' + str(result['todo']), 'exit=' + str(result['exit']))
              report['units'][key] = dict(result, completed_scenarios=int(match[1]) if match else None,
                                        skipped_scenarios=int(match[2]) if match else None,
                                        component_snapshots=int(scope[1]) if scope else None,
                                        absolute_snapshots=int(scope[2]) if scope else None,
                                        absolute_state=int(scope[3]) if scope else None,
                                        positive_checks=int(scope[4]) if scope else None)
              counters = {k: report['units'][key][k] for k in
                          ['finished', 'tests', 'failures', 'todo', 'skipped', 'exit',
                           'completed_scenarios', 'skipped_scenarios', 'component_snapshots',
                           'absolute_snapshots', 'absolute_state', 'positive_checks']}
              print('::notice title=Attachment scope ' + variant + ' ' + arch + '::' + json.dumps(counters, sort_keys=True))
              # This synthetic fixture reports only own-window identifiers,
              # public API outcomes and fixed scenario names. Preserve actual
              # per-occurrence contexts, including unexpected todo successes.
              failures = re.findall(r'^attachment\.c:\d+: Test (?:failed|succeeded inside todo block)[^\r\n]*', log, re.M)
              report['units'][key]['failure_lines'] = failures[:40]
              report['units'][key]['failure_lines_omitted'] = max(0, len(failures) - 40)
              for message in failures[:40]:
                  detail = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=Attachment failure ' + variant + ' ' + arch + '::' + detail)
              if result['flaky']:
                  errors.append(key + ': flaky checks are not a clean pass')
              if not result['finished'] or not match or match.groups() != ('44', '0'):
                  errors.append(key + ': incomplete coverage; skips are not a candidate pass')
              if not scope or scope[1] != '592' or scope[4] != '2180':
                  errors.append(key + ': missing positive component coverage')
              if scope:
                  absolute = int(scope[3])
                  if absolute not in (0, 1) or scope[2] != ('592' if absolute == 1 else '3'):
                      errors.append(key + ': absolute view status is incomplete')
                  if result['skipped'] != (1 if absolute == 0 else 0):
                      errors.append(key + ': unexplained unit skips')
              if variant == 'series' and (result['failures'] or result['exit'] not in (None, '0')):
                  errors.append(key + ': ordinary series failures remain')
              if variant == 'vanilla' and not result['failures']:
                  errors.append(key + ': vanilla target difference not demonstrated')
          Path('out/attachment-coverage-' + variant + '.json').write_text(json.dumps(report, indent=2) + '\n')
          if errors:
              raise SystemExit('\n'.join(errors))
          COVERAGE
      - name: Build log on failure
        if: failure() && env.RUN_GROUP == 'true'
        run: tail -n 80 /tmp/work/*.log || true
      - name: Slowest units
        if: always() && env.RUN_GROUP == 'true'
        run: sort -t "$(printf '\t')" -k4 -nr out/durations-*.tsv 2>/dev/null | head -15 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && env.RUN_GROUP == 'true'
        with:
          name: tests-${{ matrix.variant }}-${{ matrix.group }}
          path: out/
          retention-days: 30

  compare:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tests-vanilla-*
          path: results/vanilla
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tests-series-*
          path: results/series
      - name: Compare vanilla and series (all groups that ran on both sides)
        run: |
          set -o pipefail
          rc=0
          python3 scripts/compare-tests.py compare results/vanilla results/series > l2-report.md || rc=$?
          cat l2-report.md >> "$GITHUB_STEP_SUMMARY"
          cat l2-report.md   # also in the log, readable without the web page
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: l2-report
          path: l2-report.md
