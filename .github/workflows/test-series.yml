# L2 for the whole series and the L1 bundle: builds Wine with its tests twice
# (vanilla and patches/series), runs the test units of the DLLs the series
# touches in both, compares them (scripts/compare-tests.py) and packs the
# Wine test programs of patches whose tests never ran on Windows.
# Runs when started by hand or by a push to a test-run/<name> branch;
# publishes nothing.
name: Test series (L1 bundle, L2)

on:
  workflow_dispatch:
  push:
    branches: ['test-run/**']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, series]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 360
    steps:
      - name: Dependencies (official Arch repositories)
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git python mingw-w64-gcc xorg-server-xvfb xorg-xauth \
            alsa-lib libpulse gnutls krb5 dbus fontconfig freetype2 ttf-dejavu \
            libx11 libxext libxi libxrandr libxrender libxcursor libxcomposite libxinerama libxxf86vm libxkbcommon \
            wayland mesa libglvnd vulkan-icd-loader vulkan-headers \
            gst-plugins-base-libs sdl2 libcups libgphoto2 sane libpcap v4l-utils pcsclite unixodbc ocl-icd opencl-headers \
            giflib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build with tests and run them
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          JOBS=$(nproc) WORK=/tmp/work bash scripts/test-series.sh ${{ matrix.variant }} out
      - name: Build log on failure
        if: failure()
        run: tail -n 80 /tmp/work/*.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.variant }}
          path: out/
          retention-days: 30

  compare:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: results
      - name: Compare vanilla and series
        run: |
          python3 scripts/compare-tests.py compare results/tests-vanilla/results-vanilla.json \
            results/tests-series/results-series.json | tee l2-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: l2-report
          path: l2-report.md
