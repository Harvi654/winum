name: Compare WMI and VBScript test suites
on:
  push:
    branches: ['topic/wbemdisp-method-invoke-measure']
    paths:
      - 'patches/candidates/wbemdisp-method-invoke/*.patch'
      - 'patches/tests-first/wbemdisp-tests-method-invoke.patch'
      - '.github/workflows/test-wbemdisp-method-invoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wbemdisp-method-invoke-l2
  cancel-in-progress: true
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 150
    env:
      VARIANT: ${{ matrix.variant }}
      TESTS: wbemdisp wbemprox vbscript
      GROUP: wmi
      MAKE_L1: '0'
      WORK: /tmp/wmi-tests
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependencies (official Arch repositories)
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git python curl xz mingw-w64-gcc xorg-server-xvfb xorg-xauth \
            alsa-lib libpulse gnutls krb5 dbus fontconfig freetype2 ttf-dejavu \
            libx11 libxext libxi libxrandr libxrender libxcursor libxcomposite libxinerama libxxf86vm libxkbcommon \
            wayland mesa libglvnd vulkan-icd-loader vulkan-headers \
            gst-plugins-base-libs sdl2 libcups libgphoto2 sane libpcap v4l-utils pcsclite unixodbc ocl-icd opencl-headers giflib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test the release series with the measured unit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          unit=wbemdisp-tests-method-invoke.patch
          printf '%s\n' "$unit" >> patches/tests-first/series
          if [[ "$VARIANT" == candidate ]]; then
            cp patches/candidates/wbemdisp-method-invoke/wbemdisp-method-invoke.patch patches/
            printf '%s\n' wbemdisp-method-invoke.patch >> patches/series
            python3 - "$unit" <<'PY'
          from pathlib import Path
          import re
          import sys

          patch = Path("patches/tests-first") / sys.argv[1]
          text = patch.read_text()
          marker = "+    todo_wine\n"
          assert text.count(marker) == 1
          text = text.replace(marker, "")
          text, n = re.subn(r"(?m)^@@ -0,0 \+1,(\d+) @@$", lambda m: f"@@ -0,0 +1,{int(m[1]) - 1} @@", text)
          assert n == 1
          patch.write_text(text)
          PY
          fi
          bash scripts/test-series.sh series out
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          out = Path("out")
          data = json.loads((out / "results-series-wmi.json").read_text())
          for suite in ("wbemdisp", "wbemprox", "vbscript"):
              for arch in ("x86_64", "i386"):
                  assert any(k.startswith(f"{suite}.{arch}.") for k in data), (suite, arch)
          for arch in ("x86_64", "i386"):
              report = (out / f"logs/wbemdisp.{arch}.method.log").read_text()
              assert re.search(r"method: \d+ tests executed .*0 failures\), 0 skipped", report), report
              print(report)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wbemdisp-l2-${{ matrix.variant }}
          path: |
            out/results-series-wmi.json
            out/logs/
          if-no-files-found: warn
          retention-days: 30
  compare:
    needs: suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wbemdisp-l2-*
          path: results
      - name: Compare the matching DLL suites
        run: |
          set -o pipefail
          python3 scripts/compare-tests.py compare results/wbemdisp-l2-baseline results/wbemdisp-l2-candidate \
            | tee "$GITHUB_STEP_SUMMARY"
