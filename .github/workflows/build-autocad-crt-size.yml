name: Build AutoCAD CRT size comparison

on:
  push:
    branches: ['topic/autocad-dwg-failfast']
    paths:
      - '.github/workflows/build-autocad-crt-size.yml'
      - 'patches/candidates/ucrtbase-cxx-exception-size/*.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 25
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git mingw-w64-gcc
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Compile the baseline and candidate x64 UCRT DLLs
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=aeb7a59084c3fd84fa6aeaa1f0f16a551abafcb0
          reference="$RUNNER_TEMP/reference"
          mkdir -- "$reference"
          git archive "$base" patches wine/version.env | tar -x -C "$reference"
          source "$reference/wine/version.env"
          source scripts/lib/wine-source.sh
          source scripts/lib/wine-patches.sh
          export WINE_PINNED_VERSION="$WINE_VERSION"
          test "$WINE_VERSION" = 11.22
          src="$RUNNER_TEMP/wine-$WINE_VERSION"
          bundle="$GITHUB_WORKSPACE/out/autocad-crt-size-ab"
          candidate="$GITHUB_WORKSPACE/patches/candidates/ucrtbase-cxx-exception-size/ucrtbase-cxx-exception-size.patch"
          curl -fLsS --retry 3 -o "$src.tar.xz" "https://dl.winehq.org/wine/source/11.x/wine-$WINE_VERSION.tar.xz"
          wine_verify_tarball "$src.tar.xz" "$WINE_VERSION"
          tar -xJf "$src.tar.xz" -C "$RUNNER_TEMP"
          wine_apply_patches "$src" "$reference/patches" "$GITHUB_WORKSPACE" "$base"
          mkdir -p -- "$src/build" "$bundle/baseline" "$bundle/candidate"
          cd "$src/build"
          ../configure --enable-archs=x86_64,i386 --disable-tests \
            --without-x --without-wayland --without-vulkan --without-opengl \
            --without-freetype --without-fontconfig --without-alsa --without-pulse \
            > configure.log 2>&1 || { tail -n 45 configure.log; exit 1; }
          target=dlls/ucrtbase/x86_64-windows/ucrtbase.dll
          make -j"$(nproc)" "$target" > baseline.log 2>&1 || { tail -n 70 baseline.log; exit 1; }
          cp -- "$target" "$bundle/baseline/ucrtbase.dll"
          patch -d "$src" -p1 --fuzz=0 < "$candidate"
          printf '\n/* Modified by winum: x86-64 C++ exception size candidate. */\n' >> "$src/dlls/msvcrt/except.c"
          make -j"$(nproc)" "$target" > candidate.log 2>&1 || { tail -n 70 candidate.log; exit 1; }
          cp -- "$target" "$bundle/candidate/ucrtbase.dll"
          if cmp -s "$bundle/baseline/ucrtbase.dll" "$bundle/candidate/ucrtbase.dll"; then
            echo 'The CRT build pair is identical.' >&2
            exit 1
          fi
          cp -- "$src/COPYING.LIB" "$src/PATCHES.txt" "$candidate" "$bundle/"
          printf 'wine_version=%s\nreference_commit=%s\ncandidate_commit=%s\n' \
            "$WINE_VERSION" "$base" "$GITHUB_SHA" > "$bundle/BUILDINFO"
          cd "$bundle"
          sha256sum BUILDINFO COPYING.LIB PATCHES.txt ./*.patch baseline/ucrtbase.dll candidate/ucrtbase.dll > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autocad-crt-size-ab
          path: out/autocad-crt-size-ab/
          retention-days: 30
