name: Build AutoCAD CRT size comparison

on:
  push:
    branches: ['topic/autocad-dwg-failfast']
    paths:
      - '.github/workflows/build-autocad-crt-size.yml'
      - 'patches/candidates/ucrtbase-cxx-exception-size/*.patch'
      - 'patches/tests-first/ucrtbase-tests-cxx-exception-size.patch'
      - 'docs/wine-repro/shell32-autocomplete-timing/measure-crt-size.c'
      - 'docs/wine-repro/shell32-autocomplete-timing/crt-size.list'
      - 'scripts/test-ucrtbase-cxx-exception-size.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 25
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git mingw-w64-gcc
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build the x64 and i686 measurement programs
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build-measure-bundle.sh out/crt-size-measure "$GITHUB_WORKSPACE/docs/wine-repro/shell32-autocomplete-timing/crt-size.list"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autocad-crt-size-measure
          path: out/crt-size-measure/
          retention-days: 30
      - name: Compile the baseline and candidate UCRT DLLs and Wine tests
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=aeb7a59084c3fd84fa6aeaa1f0f16a551abafcb0
          reference="$RUNNER_TEMP/reference"
          mkdir -- "$reference"
          git archive "$base" patches wine/version.env | tar -x -C "$reference"
          source "$reference/wine/version.env"
          source scripts/lib/wine-source.sh
          source scripts/lib/wine-patches.sh
          export WINE_PINNED_VERSION="$WINE_VERSION"
          test "$WINE_VERSION" = 11.22
          src="$RUNNER_TEMP/wine-$WINE_VERSION"
          bundle="$GITHUB_WORKSPACE/out/autocad-crt-size-ab"
          candidate="$GITHUB_WORKSPACE/patches/candidates/ucrtbase-cxx-exception-size/ucrtbase-cxx-exception-size.patch"
          curl -fLsS --retry 3 -o "$src.tar.xz" "https://dl.winehq.org/wine/source/11.x/wine-$WINE_VERSION.tar.xz"
          wine_verify_tarball "$src.tar.xz" "$WINE_VERSION"
          tar -xJf "$src.tar.xz" -C "$RUNNER_TEMP"
          wine_apply_patches "$src" "$reference/patches" "$GITHUB_WORKSPACE" "$base"
          test_patch="$GITHUB_WORKSPACE/patches/tests-first/ucrtbase-tests-cxx-exception-size.patch"
          patch -d "$src" -p1 --fuzz=0 < "$test_patch"
          mkdir -p -- "$src/build" "$bundle/baseline" "$bundle/candidate"
          cd "$src/build"
          ../configure --enable-archs=x86_64,i386 --enable-tests \
            --without-x --without-wayland --without-vulkan --without-opengl \
            --without-freetype --without-fontconfig --without-alsa --without-pulse \
            > configure.log 2>&1 || { tail -n 45 configure.log; exit 1; }
          target=dlls/ucrtbase/x86_64-windows/ucrtbase.dll
          target32=dlls/ucrtbase/i386-windows/ucrtbase.dll
          tests=(dlls/ucrtbase/tests/{x86_64,i386}-windows/ucrtbase_test.exe)
          make -j"$(nproc)" "$target" "$target32" "${tests[@]}" > baseline.log 2>&1 || { tail -n 70 baseline.log; exit 1; }
          cp -- "$target" "$bundle/baseline/ucrtbase.dll"
          mkdir -p -- "$bundle/baseline/i386" "$bundle/candidate/i386" "$bundle/tests/"
          cp -- "$target32" "$bundle/baseline/i386/ucrtbase.dll"
          cp -- "${tests[0]}" "$bundle/tests/ucrtbase-x86_64.exe"
          cp -- "${tests[1]}" "$bundle/tests/ucrtbase-i386.exe"
          patch -d "$src" -p1 --fuzz=0 < "$candidate"
          printf '\n/* Modified by winum: x86-64 C++ exception size candidate. */\n' >> "$src/dlls/msvcrt/except.c"
          make -j"$(nproc)" "$target" "$target32" > candidate.log 2>&1 || { tail -n 70 candidate.log; exit 1; }
          cp -- "$target" "$bundle/candidate/ucrtbase.dll"
          cp -- "$target32" "$bundle/candidate/i386/ucrtbase.dll"
          if cmp -s "$bundle/baseline/ucrtbase.dll" "$bundle/candidate/ucrtbase.dll"; then
            echo 'The CRT build pair is identical.' >&2
            exit 1
          fi
          cp -- "$src/COPYING.LIB" "$src/PATCHES.txt" "$candidate" "$test_patch" "$bundle/"
          printf 'wine_version=%s\nreference_commit=%s\ncandidate_commit=%s\n' \
            "$WINE_VERSION" "$base" "$GITHUB_SHA" > "$bundle/BUILDINFO"
          cd "$bundle"
          sha256sum BUILDINFO COPYING.LIB PATCHES.txt ./*.patch {baseline,candidate}/ucrtbase.dll \
            {baseline,candidate}/i386/ucrtbase.dll tests/*.exe > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autocad-crt-size-ab
          path: out/autocad-crt-size-ab/
          retention-days: 30

  paired:
    needs: comparison
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed git python xorg-server-xvfb \
            libx11 libxext libxi libxrandr libxrender libxcursor libxcomposite libxinerama \
            libxxf86vm libxkbcommon fontconfig freetype2 ttf-dejavu libglvnd mesa \
            wayland gnutls alsa-lib libpulse krb5 dbus
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: autocad-crt-size-ab
          path: crt-bundle
      - name: Compare existing UCRT tests on x64 and i686
        shell: bash
        run: bash scripts/test-ucrtbase-cxx-exception-size.sh crt-bundle out/paired
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: autocad-crt-size-l2
          path: out/paired/
          retention-days: 30
