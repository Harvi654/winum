name: Build MSXML selection removeAll overlay

on:
  push:
    branches: ['topic/msxml3-selection-removeall']
    paths:
      - 'patches/candidates/msxml3-selection-removeall/*.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git mingw-w64-gcc curl xz libxml2 libxslt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build and package both msxml3 architectures
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=ec9fd62ed2128e0584f3efed4c83a7211af84407
          git diff --exit-code "$base" HEAD -- wine/version.env patches/series ':(glob)patches/*.patch'
          source wine/version.env
          source scripts/lib/wine-source.sh
          source scripts/lib/wine-patches.sh
          export WINE_PINNED_VERSION="$WINE_VERSION"

          candidate=msxml3-selection-removeall
          patch_file="$candidate.patch"
          patchdir=$(mktemp -d)
          cp patches/series patches/*.patch "$patchdir/"
          cp "patches/candidates/$candidate/$patch_file" "$patchdir/"
          printf '%s\n' "$patch_file" >> "$patchdir/series"

          work=$(mktemp -d)
          src="$work/wine-$WINE_VERSION"
          curl -fLsS --retry 3 -o "$src.tar.xz" \
            "https://dl.winehq.org/wine/source/${WINE_VERSION%%.*}.x/wine-$WINE_VERSION.tar.xz"
          wine_verify_tarball "$src.tar.xz" "$WINE_VERSION"
          tar -xJf "$src.tar.xz" -C "$work"
          wine_apply_patches "$src" "$patchdir" "$GITHUB_WORKSPACE" HEAD

          mkdir "$src/build"
          cd "$src/build"
          ../configure --enable-archs=x86_64,i386 --disable-tests --without-x \
            --without-wayland --without-vulkan --without-opengl --without-freetype \
            --without-fontconfig --without-alsa --without-pulse > configure.log 2>&1 ||
            { tail -n 60 configure.log; exit 1; }
          make -j"$(nproc)" dlls/msxml3/{x86_64,i386}-windows/msxml3.dll > build.log 2>&1 ||
            { tail -n 80 build.log; exit 1; }

          out="$GITHUB_WORKSPACE/overlay"
          for arch in x86_64 i386; do
            install -Dm644 "dlls/msxml3/$arch-windows/msxml3.dll" "$out/$arch-windows/msxml3.dll"
          done
          cp "$src"/{COPYING.LIB,PATCHES.txt} "$out/"
          cp "$patchdir/$patch_file" "$out/"
          cd "$out"
          printf 'MSXML selection removeAll overlay for winum-11.22-3\nBase %s\nCommit %s\n' \
            "$base" "$GITHUB_SHA" > BUILDINFO
          sha256sum BUILDINFO COPYING.LIB PATCHES.txt ./*.patch ./*-windows/msxml3.dll > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msxml3-selection-removeall-overlay
          path: overlay/
          if-no-files-found: error
          retention-days: 30
