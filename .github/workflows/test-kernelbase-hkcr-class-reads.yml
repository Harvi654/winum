name: Compare the HKCR class reads candidate
on:
  push:
    branches: ['test-run/kernelbase-hkcr-class-reads']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kernelbase-hkcr-class-reads-l2
  cancel-in-progress: true
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 150
    env:
      VARIANT: ${{ matrix.variant }}
      TESTS: advapi32 kernelbase ole32 combase shell32
      GROUP: hkcr
      MAKE_L1: '0'
      WORK: /tmp/hkcr-tests
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependencies (official Arch repositories)
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git python curl xz mingw-w64-gcc xorg-server-xvfb xorg-xauth \
            alsa-lib libpulse gnutls krb5 dbus fontconfig freetype2 ttf-dejavu \
            libx11 libxext libxi libxrandr libxrender libxcursor libxcomposite libxinerama libxxf86vm libxkbcommon \
            wayland mesa libglvnd vulkan-icd-loader vulkan-headers \
            gst-plugins-base-libs sdl2 libcups libgphoto2 sane libpcap v4l-utils pcsclite unixodbc ocl-icd opencl-headers giflib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and run existing suites
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$VARIANT" == candidate ]]; then
            cp patches/candidates/kernelbase-hkcr-class-reads/kernelbase-hkcr-class-reads.patch patches/
            printf '%s\n' kernelbase-hkcr-class-reads.patch >> patches/series
          fi
          bash scripts/test-series.sh series out
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("out/results-series-hkcr.json").read_text())
          for suite in os.environ["TESTS"].split():
              for arch in ("x86_64", "i386"):
                  assert any(unit.startswith(f"{suite}.{arch}.") for unit in data), (suite, arch)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hkcr-l2-${{ matrix.variant }}
          path: |
            out/results-series-hkcr.json
            out/logs/
          if-no-files-found: warn
  compare:
    needs: suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hkcr-l2-*
          path: results
      - name: Compare the same units in both configurations
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def units(variant):
              path, = Path(f"results/hkcr-l2-{variant}").rglob("results-series-hkcr.json")
              return set(json.loads(path.read_text()))
          assert units("baseline") == units("candidate"), "test unit coverage differs"
          PY
          python3 scripts/compare-tests.py compare results/hkcr-l2-baseline results/hkcr-l2-candidate \
            | tee "$GITHUB_STEP_SUMMARY"
