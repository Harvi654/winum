name: Build AutoCAD licensing dialog trace

on:
  push:
    branches: ['topic/autocad-scm-session']
    paths:
      - '.github/workflows/build-autocad-licensing-dialog.yml'
      - 'patches/debug/autocad-licensing-dialog/**'
      - 'scripts/prepare-autocad-licensing-dialog-trace.sh'
      - 'scripts/trace-autocad-licensing-service.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git mingw-w64-gcc xorg-server-xvfb \
            libx11 libxext libxi libxrandr libxrender libxcursor libxcomposite libxinerama \
            libxxf86vm libxkbcommon fontconfig freetype2 ttf-dejavu libglvnd mesa \
            wayland gnutls alsa-lib libpulse krb5 dbus
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build the temporary Common Controls diagnostic DLL
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ref=aeb7a59084c3fd84fa6aeaa1f0f16a551abafcb0
          reference="$RUNNER_TEMP/reference"
          mkdir -- "$reference"
          git archive "$ref" patches wine/version.env | tar -x -C "$reference"
          source "$reference/wine/version.env"
          source scripts/lib/wine-source.sh
          source scripts/lib/wine-patches.sh
          export WINE_PINNED_VERSION="$WINE_VERSION"
          test "$WINE_VERSION" = 11.22
          src="$RUNNER_TEMP/wine-$WINE_VERSION"
          bundle="$GITHUB_WORKSPACE/out/dialog-trace"
          diagnostic="$GITHUB_WORKSPACE/patches/debug/autocad-licensing-dialog/comctl32-licensing-dialog.patch"
          curl -fLsS --retry 3 -o "$src.tar.xz" "https://dl.winehq.org/wine/source/11.x/wine-$WINE_VERSION.tar.xz"
          wine_verify_tarball "$src.tar.xz" "$WINE_VERSION"
          tar -xJf "$src.tar.xz" -C "$RUNNER_TEMP"
          wine_apply_patches "$src" "$reference/patches" "$GITHUB_WORKSPACE" "$ref"
          patch -d "$src" -p1 --fuzz=0 < "$diagnostic"
          mkdir -p "$src/build" "$bundle"
          cd "$src/build"
          ../configure --enable-archs=x86_64,i386 --disable-tests \
            --without-x --without-wayland --without-vulkan --without-opengl \
            --without-freetype --without-fontconfig --without-alsa --without-pulse \
            > configure.log 2>&1 || { tail -n 50 configure.log; exit 1; }
          target=dlls/comctl32_v6/x86_64-windows/comctl32_v6.dll
          make -j"$(nproc)" "$target" > build.log 2>&1 || { tail -n 70 build.log; exit 1; }
          cp -- "$target" "$src/COPYING.LIB" "$src/PATCHES.txt" "$diagnostic" "$bundle/"
          cp -- "$GITHUB_WORKSPACE/scripts/"{prepare-autocad-licensing-dialog-trace,trace-autocad-licensing-service}.sh "$bundle/"
          printf 'wine_version=%s\nreference_commit=%s\nbuild_commit=%s\n' \
            "$WINE_VERSION" "$ref" "$GITHUB_SHA" > "$bundle/BUILDINFO"
          cd "$bundle"
          sha256sum BUILDINFO COPYING.LIB PATCHES.txt ./*.patch ./*.sh comctl32_v6.dll > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Verify a simulated dialog reports the caller before it appears
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d /tmp/winum-taskdialog.XXXXXXXX)"
          runtime=winum-11.22-1-x86_64
          bundle="$GITHUB_WORKSPACE/out/dialog-trace"
          curl -fLsS --retry 3 -o "$work/$runtime.tar.xz" \
            "https://github.com/Harvi654/winum/releases/download/winum-11.22-1/$runtime.tar.xz"
          printf '%s  %s\n' 058051281c876d3bb0919c93f9143c20667f5c3ef35365eb97f35d5efeb76299 \
            "$work/$runtime.tar.xz" | sha256sum -c -
          tar -xJf "$work/$runtime.tar.xz" -C "$work"
          cd "$work"
          cat >probe.c <<'C'
          #define _WIN32_WINNT 0x0600
          #include <windows.h>
          #include <commctrl.h>
          typedef HRESULT (WINAPI *show_fn)(const TASKDIALOGCONFIG *, int *, int *, BOOL *);
          static HRESULT CALLBACK close_later(HWND hwnd, UINT event, WPARAM elapsed, LPARAM lp, LONG_PTR data)
          {
              if (event == TDN_TIMER && elapsed > 500) PostMessageW(hwnd, TDM_CLICK_BUTTON, IDOK, 0);
              return S_OK;
          }
          int main(void)
          {
              TASKDIALOGCONFIG config = {0};
              show_fn show = (void *)GetProcAddress(LoadLibraryW(L"comctl32.dll"), "TaskDialogIndirect");
              if (!show) return 2;
              config.cbSize = sizeof(config);
              config.pszWindowTitle = L"Desktop Licensing Service - Connection Lost";
              config.pszMainInstruction = L"Winum dialog trace probe";
              config.dwCommonButtons = TDCBF_OK_BUTTON;
              config.dwFlags = TDF_CALLBACK_TIMER;
              config.pfCallback = close_later;
              return FAILED(show(&config, NULL, NULL, NULL));
          }
          C
          cat >probe.manifest <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <assembly manifestVersion="1.0" xmlns="urn:schemas-microsoft-com:asm.v1">
            <assemblyIdentity name="Winum.Test.TaskDialog" processorArchitecture="amd64" version="1.0.0.0" type="win32"/>
            <dependency><dependentAssembly>
              <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*"/>
            </dependentAssembly></dependency>
          </assembly>
          XML
          printf '1 24 "probe.manifest"\n' > probe.rc
          x86_64-w64-mingw32-windres probe.rc probe-res.o
          x86_64-w64-mingw32-gcc -O2 -Wall -Werror probe.c probe-res.o -o dialog-probe.exe -luser32
          Xvfb -displayfd 3 -screen 0 1024x768x24 -nolisten tcp 3>"$work/display" &
          display_pid=$!
          export WINEPREFIX="$work/prefix" WINESERVER="$work/$runtime/bin/wineserver"
          export WINELOADER="$work/$runtime/lib/wine/x86_64-unix/wine"
          export WINEDEBUG=-all WINEDLLOVERRIDES='mscoree,mshtml='
          trap 'timeout 8s "$WINESERVER" -k >/dev/null 2>&1 || true; kill "$display_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 50); do
            [[ -s "$work/display" ]] && break
            sleep .2
          done
          test -s "$work/display"
          export DISPLAY=":$(<"$work/display")"
          timeout -k 5 100 "$WINELOADER" wineboot -i >"$work/wineboot.log" 2>&1 ||
            { cat "$work/wineboot.log"; exit 1; }
          timeout -k 4 45 "$WINESERVER" -w
          sxs="$WINEPREFIX/drive_c/windows/winsxs/amd64_microsoft.windows.common-controls_6595b64144ccf1df_6.0.2600.2982_none_deadbeef/comctl32.dll"
          test -f "$sxs"
          cp --remove-destination -- "$bundle/comctl32_v6.dll" "$sxs"
          cp --remove-destination -- "$bundle/comctl32_v6.dll" "$work/$runtime/lib/wine/x86_64-windows/comctl32_v6.dll"
          WINEDEBUG=-all,+pid,+timestamp,dialog-probe.exe:+taskdialog timeout -k 4 30 \
            "$WINELOADER" "$work/dialog-probe.exe" >"$work/probe.log" 2>&1 ||
            { tail -80 "$work/probe.log"; exit 1; }
          grep -E 'licensing_dialog (caller|frame)=' "$work/probe.log" | tee "$bundle/probe-summary.txt"
          grep -F 'licensing_dialog caller=0 module=L"dialog-probe.exe"' "$bundle/probe-summary.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autocad-licensing-dialog-trace
          path: out/dialog-trace/
          retention-days: 30
