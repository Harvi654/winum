name: Test AF_UNIX candidate

on:
  workflow_dispatch:
  push:
    branches: ['topic/ws2_32-af-unix', 'test-run/ws2_32-af-unix-v4-*']
    paths:
      - 'patches/candidates/ws2_32-af-unix/**'
      - 'scripts/test-afunix.sh'
      - 'scripts/build-l1-ws2_32-afunix.sh'
      - 'docs/wine-repro/ws2_32-afunix/**'
      - '.github/workflows/test-afunix.yml'

permissions:
  contents: read

concurrency:
  group: afunix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(startsWith(github.ref_name, 'test-run/ws2_32-af-unix-v4-') && '["tests", "v3", "candidate"]' || '["tests", "candidate"]') }}
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 300
    steps:
      - name: Dependencies (official Arch repositories)
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git python mingw-w64-gcc xorg-server-xvfb xorg-xauth \
            alsa-lib libpulse gnutls krb5 dbus fontconfig freetype2 ttf-dejavu \
            libx11 libxext libxi libxrandr libxrender libxcursor libxcomposite libxinerama libxxf86vm libxkbcommon \
            wayland mesa libglvnd vulkan-icd-loader vulkan-headers \
            gst-plugins-base-libs sdl2 libcups libgphoto2 sane libpcap v4l-utils pcsclite unixodbc ocl-icd opencl-headers \
            giflib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build and test (${{ matrix.variant }})
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export JOBS="$(nproc)"
          export WORK=/tmp/work
          bash scripts/test-afunix.sh ${{ matrix.variant }} out
      - name: Build log on failure
        if: failure()
        run: tail -n 80 /tmp/work/*.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: afunix-${{ matrix.variant }}
          path: out/
          retention-days: 30

  offline-l1:
    if: startsWith(github.ref_name, 'test-run/ws2_32-af-unix-v4-')
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: MinGW (official Arch repositories)
        run: pacman -Syu --noconfirm --needed git python mingw-w64-gcc
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and verify the offline test bundle
        run: |
          bash scripts/build-l1-ws2_32-afunix.sh out
          cd out
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: afunix-v4-l1
          path: out/
          retention-days: 30

  compare-v4:
    if: startsWith(github.ref_name, 'test-run/ws2_32-af-unix-v4-')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: afunix-tests
          path: out/afunix-tests
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: afunix-v3
          path: out/afunix-v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: afunix-candidate
          path: out/afunix-candidate
      - name: Compare Wine tests against v3 and the test-only baseline
        run: |
          python3 scripts/compare-afunix-tests.py out/afunix-v3 out/afunix-candidate
          python3 scripts/compare-afunix-tests.py out/afunix-tests out/afunix-candidate
