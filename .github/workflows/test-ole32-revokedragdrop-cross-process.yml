name: Compare ole32 RevokeDragDrop suites
on:
  push:
    branches: ['topic/ole32-revokedragdrop-cross-process']
    paths:
      - 'patches/candidates/ole32-revokedragdrop-cross-process/*.patch'
      - 'patches/tests-first/ole32-tests-revokedragdrop-cross-process.patch'
      - '.github/workflows/test-ole32-revokedragdrop-cross-process.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ole32-revokedragdrop-cross-process-l2
  cancel-in-progress: true
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 180
    env:
      VARIANT: ${{ matrix.variant }}
      TESTS: ole32 combase user32
      GROUP: revoke
      MAKE_L1: '0'
      WORK: /tmp/revoke-tests
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependencies (official Arch repositories)
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git python curl xz mingw-w64-gcc xorg-server-xvfb xorg-xauth \
            alsa-lib libpulse gnutls krb5 dbus fontconfig freetype2 ttf-dejavu \
            libx11 libxext libxi libxrandr libxrender libxcursor libxcomposite libxinerama libxxf86vm libxkbcommon \
            wayland mesa libglvnd vulkan-icd-loader vulkan-headers \
            gst-plugins-base-libs sdl2 libcups libgphoto2 sane libpcap v4l-utils pcsclite unixodbc ocl-icd opencl-headers giflib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test the release series with the measured unit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$VARIANT" == candidate ]]; then
            cp patches/candidates/ole32-revokedragdrop-cross-process/ole32-revokedragdrop-cross-process.patch patches/
            printf '%s\n' ole32-revokedragdrop-cross-process.patch >> patches/series
            printf '%s\n' ole32-tests-revokedragdrop-cross-process.patch >> patches/tests-first/series
          fi
          bash scripts/test-series.sh series out
          python3 - <<'PY'
          import json
          from pathlib import Path

          out = Path("out")
          data = json.loads((out / "results-series-revoke.json").read_text())
          for suite in ("ole32", "combase", "user32"):
              for arch in ("x86_64", "i386"):
                  assert any(key.startswith(f"{suite}.{arch}.") for key in data), (suite, arch)
          for arch in ("x86_64", "i386"):
              result = data[f"ole32.{arch}.dragdrop"]
              assert result["finished"], result
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ole32-revokedragdrop-l2-${{ matrix.variant }}
          path: |
            out/results-series-revoke.json
            out/logs/
          if-no-files-found: warn
          retention-days: 30
  compare:
    needs: suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ole32-revokedragdrop-l2-*
          path: results
      - name: Compare the matching DLL suites
        run: |
          set -o pipefail
          python3 scripts/compare-tests.py compare results/ole32-revokedragdrop-l2-baseline results/ole32-revokedragdrop-l2-candidate \
            | tee "$GITHUB_STEP_SUMMARY"
