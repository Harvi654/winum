name: Build riched20 paragraph expansion overlay

on:
  push:
    branches: ['topic/riched20-textrange-expand-paragraph']
    paths:
      - 'patches/candidates/riched20-textrange-expand-paragraph/*.patch'
  workflow_dispatch:
    inputs:
      navigation_only:
        description: 'Build paragraph navigation without the tab-stop candidate'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  overlay:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 35
    env:
      NAVIGATION_ONLY: ${{ inputs.navigation_only }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git mingw-w64-gcc curl xz
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build and package both riched20 architectures
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=ec9fd62ed2128e0584f3efed4c83a7211af84407
          git diff --exit-code "$base" HEAD -- wine/version.env patches/series ':(glob)patches/*.patch'
          source wine/version.env
          source scripts/lib/wine-source.sh
          source scripts/lib/wine-patches.sh
          export WINE_PINNED_VERSION="$WINE_VERSION"

          candidate=riched20-textrange-expand-paragraph
          patch_file="$candidate.patch"
          patchdir=$(mktemp -d)
          cp patches/series patches/*.patch "$patchdir/"
          artifact=riched20-paragraph-navigation-only-overlay
          overlay_patches=()
          if [[ "$NAVIGATION_ONLY" != true ]]; then
            tab_stop_commit=5e28f985333d214841ccfd1ad86b5e5fc281b16e
            git fetch --no-tags origin "$tab_stop_commit"
            tab_stop_patch=riched20-default-tab-stop.patch
            git show "$tab_stop_commit:patches/candidates/riched20-default-tab-stop/$tab_stop_patch" \
              > "$patchdir/$tab_stop_patch"
            overlay_patches+=("$tab_stop_patch")
            artifact=riched20-expand-paragraph-and-tab-stop-overlay
          fi
          cp "patches/candidates/$candidate/$patch_file" "$patchdir/"
          overlay_patches+=("$patch_file")
          printf '%s\n' "${overlay_patches[@]}" >> "$patchdir/series"
          printf 'OVERLAY_ARTIFACT=%s\n' "$artifact" >> "$GITHUB_ENV"

          work=$(mktemp -d)
          src="$work/wine-$WINE_VERSION"
          curl -fLsS --retry 3 -o "$src.tar.xz" \
            "https://dl.winehq.org/wine/source/${WINE_VERSION%%.*}.x/wine-$WINE_VERSION.tar.xz"
          wine_verify_tarball "$src.tar.xz" "$WINE_VERSION"
          tar -xJf "$src.tar.xz" -C "$work"
          wine_apply_patches "$src" "$patchdir" "$GITHUB_WORKSPACE" HEAD

          mkdir "$src/build"
          cd "$src/build"
          ../configure --enable-archs=x86_64,i386 --disable-tests --without-x \
            --without-wayland --without-vulkan --without-opengl --without-freetype \
            --without-fontconfig --without-alsa --without-pulse > configure.log 2>&1 ||
            { tail -n 60 configure.log; exit 1; }
          make -j"$(nproc)" dlls/riched20/{x86_64,i386}-windows/riched20.dll > build.log 2>&1 ||
            { tail -n 80 build.log; exit 1; }

          out="$GITHUB_WORKSPACE/overlay"
          for arch in x86_64 i386; do
            install -Dm644 "dlls/riched20/$arch-windows/riched20.dll" "$out/$arch-windows/riched20.dll"
          done
          cp "$src"/{COPYING.LIB,PATCHES.txt} "$out/"
          for patch in "${overlay_patches[@]}"; do
            cp "$patchdir/$patch" "$out/"
          done
          cd "$out"
          printf '%s for winum-11.22-3\nBase %s\nCommit %s\nTab stop commit %s\n' \
            "$artifact" "$base" "$GITHUB_SHA" "${tab_stop_commit:-none}" > BUILDINFO
          sha256sum BUILDINFO COPYING.LIB PATCHES.txt ./*.patch ./*-windows/riched20.dll > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.OVERLAY_ARTIFACT }}
          path: overlay/
          if-no-files-found: error
          retention-days: 30
